version: '3.8'
services:
  dem1_db:
    image: mysql:8.0
    container_name: dem1_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fW7W6SAWHYo0hc2Q
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: fW7W6SAWHYo0hc2Q
    volumes:
    - dem1_db_data:/var/lib/mysql
    networks:
    - dem1_network
  dem1_wordpress:
    depends_on:
    - dem1_db
    image: wordpress:latest
    container_name: dem1_wp
    restart: unless-stopped
    ports:
    - 9004:80
    environment:
      WORDPRESS_DB_HOST: dem1_db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: fW7W6SAWHYo0hc2Q
      WORDPRESS_DB_NAME: wordpress
    volumes:
    - dem1_wp_data:/var/www/html
    networks:
    - dem1_network
volumes:
  dem1_db_data: {}
  dem1_wp_data: {}
networks:
  dem1_network:
    driver: bridge
