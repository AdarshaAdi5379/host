# HOST API Gateway
# Phase 1: Routing only

upstream host_control_plane {
    server host.docker.internal:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Simple gateway health endpoint
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Route all platform API traffic to Django (control plane)
    location /api/ {
        proxy_pass http://host_control_plane;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Routing-only phase: reject anything outside /api/*
    location / {
        default_type application/json;
        return 404 '{"error":"Route not found on API gateway","hint":"Use /api/*"}';
    }
}
